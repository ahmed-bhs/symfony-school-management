# Jekyll configuration for GitHub Pages with Just the Docs theme

# Site settings
title: School Management System
description: Symfony 7.4 School Management System with EasyAdmin - Complete Documentation
baseurl: "/symfony-school-management"
url: "https://ahmed-bhs.github.io"

# Repository
repository: ahmed-bhs/symfony-school-management
github_username: ahmed-bhs

# Theme
remote_theme: just-the-docs/just-the-docs@v0.8.2

# Logo
# logo: "/images/logo.png"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Navigation
nav_sort: title
nav_external_links:
  - title: GitHub Repository
    url: https://github.com/ahmed-bhs/symfony-school-management
  - title: Original Project (Symfony 3.1)
    url: https://github.com/ahmed-bhs/old-school-project

# Code highlighting
color_scheme: light
highlighter: rouge

# Syntax highlighting theme
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Callouts
callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# Footer
footer_content: 'Copyright &copy; 2017-2026 Ahmed BEN HASSINE. Distributed under the <a href="https://github.com/ahmed-bhs/symfony-school-management/blob/main/LICENSE">MIT License</a>.'

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Aux links for the upper right navigation
aux_links:
  "View on GitHub":
    - "https://github.com/ahmed-bhs/symfony-school-management"
  "Buy Me a Coffee":
    - "https://buymeacoffee.com/w6ZhBSGX2"

# Makes Aux links open in a new tab
aux_links_new_tab: true

# Heading anchor links
heading_anchors: true

# Plugins
plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# Exclude from processing
exclude:
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - Gemfile
  - Gemfile.lock
  - README.md
